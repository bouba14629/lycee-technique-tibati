<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Playfair'; src: url('{{ font_bold }}'); }
  @font-face { font-family: 'Inter'; src: url('{{ font_regular }}'); }
  @page { size: A4; margin: 0.45cm; }
  body { font-family: 'Inter', Helvetica, sans-serif; color: #1c2733; font-size: 8pt; font-weight: bold; }
  .school { font-family: 'Playfair', Helvetica, sans-serif; font-size: 12pt; color: #0B2545; font-weight: bold; }
  .title-table { width: 100%; border-top: 2pt solid #0B2545; border-bottom: 2pt solid #0B2545; margin: 4pt 0; }
  .title { font-family: 'Playfair', Helvetica, sans-serif; font-size: 13pt; color: #0B2545; text-align:center; }
  .subtitle2 { text-align:center; font-size: 7.5pt; color: #6b7688; font-style: italic; }
  .photo-box { width: 52pt; height: 64pt; border: 1.5pt solid #0B2545; text-align:center; vertical-align:middle;
               font-size: 6pt; color: #999; background: #F8F5EC; padding: 0; }
  .photo-box img { width: 52pt; height: 64pt; }
  .meta-table { width: 100%; margin-bottom: 2pt; font-size: 7.3pt; }
  .meta-table td { padding: 0.5pt 8pt 0.5pt 0; vertical-align:top; }
  .meta-table td:last-child { padding-left:10pt; }
  table.grades { width: 100%; border-collapse: collapse; margin-top: 1pt; }
  table.grades th { background-color: #F8F5EC; color: #6b7688; font-size: 5.6pt; text-transform: uppercase;
                     text-align: left; padding: 1.5pt 3pt; border: 0.5pt solid #EFE9D8; }
  table.grades th:nth-child(n+2):nth-child(-n+7) { text-align: center; }
  table.grades td { padding: 0.45pt 2.5pt; border: 0.5pt solid #F1EAD9; font-size: 5.9pt; word-wrap: break-word; line-height: 0.9; }
  .cat-row td { background-color: #EFE9D8; font-weight: bold; color: #0B2545; font-size: 5.8pt; text-transform: uppercase; padding: 0.6pt 3pt; }
  .total-row td { font-weight: bold; font-size: 6.3pt; }
  .box-table { width: 100%; margin-top: 2pt; border-collapse: collapse; }
  .box-table > tbody > tr > td { border: 0.75pt solid #CFCFCF; padding: 1.5pt; font-size: 5.9pt; vertical-align: top; }
  .box-title { color: #0B2545; font-size: 6.6pt; font-weight: bold; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 6.2pt; }
  .mini-table td { border: 0.45pt solid #CFCFCF; padding: 0.6pt 1pt; }
  .avg-box { text-align: right; margin-top: 1pt; }
  .avg-value { font-family: 'Playfair', Helvetica, sans-serif; font-size: 12pt; color: #0B2545; font-weight: bold; }
  .circled-avg {
    display: inline-block; border: 1.8pt solid #C9A227; border-radius: 12pt;
    padding: 1pt 5pt; color: #0B2545; background-color: #FBF0CE; font-weight: bold;
  }
  .number-cell { text-align: center; }
  .low-score { color: #C62828 !important; font-weight: bold; }
  .profile-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .profile-table td { border: 0.45pt solid #CFCFCF; padding: 0.65pt; font-size: 6pt; line-height: 1.1; word-wrap: break-word; }
  .profile-table td:nth-child(odd) { font-weight: bold; background-color:#FAF8F0; }
  .profile-block { margin-top: 2pt; }
  .profile-block th { border: 0.75pt solid #CFCFCF; padding: 0.8pt; color:#0B2545; font-size:6.6pt; text-align:left; }
  .profile-table td:nth-child(1), .profile-table td:nth-child(3) { width: 31%; }
  .profile-table td:nth-child(2), .profile-table td:nth-child(4) { width: 19%; text-align: center; }
  .term-average { background-color: #D9D9D9; }
  .footer-table { width: 100%; margin-top: 1pt; border-collapse: collapse; }
  .footer-table td { border: 0.75pt solid #eee3c8; padding: 1.5pt 1pt 1pt; font-size: 5.5pt; height: 38pt; vertical-align: top; }
  .digital-stamp { display: inline-block; margin-top: 3pt; padding: 2pt 4pt; border: 1pt solid #16704A; color: #16704A; font-size: 5.5pt; font-weight: bold; text-align: center; }
</style>
</head>
<body>
{% include "pdf/_bulletin_body.html" %}
</body>
</html>
