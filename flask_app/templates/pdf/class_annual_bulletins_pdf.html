<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><style>
@font-face { font-family:'Inter'; src:url('{{ font_regular }}'); }
@page { size:A4; margin:.28cm; }
body { font-family:'Inter',Arial,sans-serif; color:#111; font-size:6.7pt; }
table { width:100%; border-collapse:collapse; }
.institution td { width:28%; vertical-align:top; text-align:center; font-size:6.2pt; line-height:1.3; }
.institution td.center { width:44%; }
.title { display:inline-block; border:1.2pt solid #222; border-radius:3pt; padding:4pt 14pt 3pt; font-size:13.5pt; line-height:1.05; font-weight:bold; margin:2pt 0 1pt; }
.section-title { font-size:9.2pt; color:#0b2545; font-weight:bold; letter-spacing:.45pt; }
.title-row { margin:2pt 0 3pt; }
.title-row td { vertical-align:middle; }
.photo-frame { width:54pt; height:66pt; margin:0 auto; border:1pt solid #0b2545; background:#f2f0e7; text-align:center; overflow:hidden; }
.student-photo { width:54pt; height:66pt; object-fit:cover; }
.photo-placeholder { padding-top:22pt; font-size:5.8pt; color:#5f6875; font-weight:bold; line-height:1.35; }
.student-name { font-size:5.8pt; color:#0b2545; font-weight:bold; text-align:center; margin-top:1pt; }
.meta { margin:3pt 0 4pt; font-size:6.7pt; }.meta td { width:50%; vertical-align:top; line-height:1.5; padding:0 2pt; }.meta td:last-child { padding-left:10pt; }
.grid { table-layout:fixed; }.grid th,.grid td { border:.45pt solid #333; padding:1pt 1.5pt; vertical-align:middle; line-height:1.05; }.grid th { background:#ddd; text-align:center; font-size:5.8pt; }.grid td { font-size:5.7pt; }.grid .subject { font-weight:bold; }.grid .teacher { font-size:5.1pt; font-style:italic; font-weight:normal; }.grid .cat td { background:#d8d8d8; font-size:5.9pt; font-weight:bold; }.grid .total td { background:#f0f0f0; font-weight:bold; text-align:right; }.center { text-align:center; }
.summary { margin-top:2pt; table-layout:fixed; }.summary > tbody > tr > td { width:33.33%; border:.45pt solid #333; vertical-align:top; padding:2pt; }.summary-title { display:block; text-align:center; font-size:6.2pt; font-weight:bold; margin-bottom:1pt; }.mini td { border:.3pt solid #999; padding:1pt; font-size:5.4pt; }.mini td.label { font-weight:bold; width:61%; }.checks td { border:0; padding:.7pt; font-size:5.5pt; }.decision td { border:.45pt solid #333; vertical-align:top; padding:2pt; font-size:5.7pt; }.decision-title { font-weight:bold; text-align:center; display:block; margin-bottom:2pt; }.term-list td { border:.3pt solid #999; padding:1.2pt; font-size:5.4pt; }.visa { text-align:center; }.visa-space { height:20pt; }.digital-stamp { display:inline-block; margin-top:1pt; padding:1pt 2pt; border:.6pt solid #0b2545; color:#0b2545; font-size:4.8pt; }
.annual-page { page-break-after:always; }.annual-page:last-child { page-break-after:auto; }
</style></head><body>
{% for item in students_data %}
  <div class="annual-page">
    {% with student=item.student, data=item.data, student_photo_path=item.photo_path %}
      {% include "pdf/_annual_bulletin_body.html" %}
    {% endwith %}
  </div>
{% endfor %}
</body></html>
