{% extends "base.html" %}
{% block title %}Modifier l'annonce{% endblock %}
{% block page_title %}Modifier une annonce{% endblock %}
{% block content %}
<div class="card-ltt" style="max-width:760px;">
  <form method="post" class="form-ltt">
    <div class="mb-3"><label>Titre</label><input type="text" name="title" class="form-control" value="{{ announcement.title }}" required></div>
    <div class="mb-3"><label>Message</label><textarea name="body" rows="7" class="form-control" required>{{ announcement.body }}</textarea></div>
    <div class="mb-3"><label>Destinataires</label><select name="target_role" class="form-select"><option value="tous" {{ 'selected' if announcement.target_role == 'tous' }}>Tous</option><option value="enseignant" {{ 'selected' if announcement.target_role == 'enseignant' }}>Enseignants</option><option value="eleve" {{ 'selected' if announcement.target_role == 'eleve' }}>Élèves</option><option value="parent" {{ 'selected' if announcement.target_role == 'parent' }}>Parents</option></select></div>
    <div class="d-flex gap-2"><button class="btn-ltt-navy" type="submit"><i class="bi bi-save"></i> Enregistrer</button><a class="btn-ltt-outline" href="{{ url_for('announcements') }}">Annuler</a></div>
  </form>
</div>
{% endblock %}
